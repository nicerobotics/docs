name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'nicerobotics/docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:content
      - run: npm run test:i18n
      - run: npm run test:applications
      - run: npm run check
      - run: npm run build
      - name: Deploy the Worker, static assets, route and cron trigger
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DOCS_PUBLISH_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Check the live site
        run: |
          set -euo pipefail
          for path in / /en/ /team-nice/frc-2027/ /api/applications; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "https://docs.nicerobotics.hk$path")
            echo "$path -> $code"
            test "$code" = 200
          done
